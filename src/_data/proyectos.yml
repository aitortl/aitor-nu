# Proyectos de investigación: siempre como miembro del equipo. Sin importes.
entradas:
  - NUTRIFEN y EDUGASTRO, proyectos propios de la FEN.
  - Bases dietéticas en residencias infantiles, para la Agencia Madrileña de Atención Social.
  - Menús en centros docentes públicos y en escuelas infantiles, para la Consejería de Educación de la Comunidad de Madrid.
  - Protocolo de bases dietético-nutricionales del servicio de restauración, para el IMSERSO.
  - Guías de menús saludables para varias comunidades autónomas, con FICYE.
  - Guía sobre leche y productos lácteos para una adecuada hidratación, con INLAC.
  - Revisión bibliográfica sobre consumo y propiedades nutricionales de los zumos, con Asozumos.
  - "Día Nacional del Desayuno: organización, infografías y valoración nutricional."
